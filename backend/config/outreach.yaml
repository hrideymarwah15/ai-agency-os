sequences:
  cold_email_5touch:
    channel: EMAIL
    steps:
      - step: 1
        delay_days: 0
        template: "cold_email_1_initial"
        branch_on_reply:
          interested: "meeting"
          not_interested: "stop"
          question: "reply"
          no_reply: "continue"
      - step: 2
        delay_days: 3
        template: "cold_email_2_followup"
        branch_on_reply:
          interested: "meeting"
          not_interested: "stop"
          question: "reply"
          no_reply: "continue"
      - step: 3
        delay_days: 7
        template: "cold_email_3_value"
        branch_on_reply:
          interested: "meeting"
          not_interested: "stop"
          question: "reply"
          no_reply: "continue"
      - step: 4
        delay_days: 10
        template: "cold_email_4_soft_breakup"
        branch_on_reply:
          interested: "meeting"
          not_interested: "stop"
          question: "reply"
          no_reply: "continue"
      - step: 5
        delay_days: 14
        template: "cold_email_5_final"
        branch_on_reply:
          interested: "meeting"
          not_interested: "stop"
          question: "reply"
          no_reply: "stop"
  warm_email_3touch:
    channel: EMAIL
    steps:
      - step: 1
        delay_days: 0
        template: "warm_email_1_checkin"
        branch_on_reply:
          interested: "meeting"
          not_interested: "stop"
          question: "reply"
          no_reply: "continue"
      - step: 2
        delay_days: 4
        template: "warm_email_2_value"
        branch_on_reply:
          interested: "meeting"
          not_interested: "stop"
          question: "reply"
          no_reply: "continue"
      - step: 3
        delay_days: 8
        template: "warm_email_3_offer"
        branch_on_reply:
          interested: "meeting"
          not_interested: "stop"
          question: "reply"
          no_reply: "stop"
  linkedin_sequence:
    channel: LINKEDIN
    steps:
      - step: 1
        delay_days: 0
        template: "linkedin_1_connection"
        action: "connection_request"
      - step: 2
        delay_days: 2
        template: "linkedin_2_message"
        action: "message"
        condition: "connection_accepted"
      - step: 3
        delay_days: 5
        template: "linkedin_3_followup"
        action: "message"

# Template mapping - maps template names to actual Jinja2 templates
# These will be created in Plan 03
templates:
  cold_email_1_initial: "outreach/cold_email_1_initial.j2"
  cold_email_2_followup: "outreach/cold_email_2_followup.j2"
  cold_email_3_value: "outreach/cold_email_3_value.j2"
  cold_email_4_soft_breakup: "outreach/cold_email_4_soft_breakup.j2"
  cold_email_5_final: "outreach/cold_email_5_final.j2"
  warm_email_1_checkin: "outreach/warm_email_1_checkin.j2"
  warm_email_2_value: "outreach/warm_email_2_value.j2"
  warm_email_3_offer: "outreach/warm_email_3_offer.j2"
  linkedin_1_connection: "outreach/linkedin_1_connection.j2"
  linkedin_2_message: "outreach/linkedin_2_message.j2"
  linkedin_3_followup: "outreach/linkedin_3_followup.j2"

# Channel selection logic
channel_selection:
  linkedin_if: "decision_maker_profile_exists"
  else: "email"

# Global settings
global_settings:
  max_daily_sends_per_channel: 100
  default_from_email: "outreach@yourdomain.com"
  unsubscribe_link_template: "https://yourapi.com/api/v1/outreach/unsubscribe?token={{unsubscribe_token}}"

# Objection responses for automated handling
objection_responses:
  price: "I understand budget is a concern. The {{ package_name | default('recommended') }} package at {{ price | default('the quoted price') }} is designed around measurable ROI. Would a phased approach work better?"
  timing: "Totally get it — timing matters. We can start with a short discovery phase before committing to the full project."
  authority: "Would it help if I sent a one-page executive summary for the decision maker? I can also join a brief call."
  need: "Fair point. If {{ pain_point | default('this priority') }} changes, may I check in next quarter?"
  trust: "Trust is earned. I am happy to share a relevant case study or reference before you decide."
  competitor: "It's smart to evaluate options. What's most important to you in making this decision? I can help compare apples-to-apples."
  feature_missing: "That feature isn't in our current package, but we often add requested features based on client feedback. Let me check our roadmap."
  contract_length: "I understand the hesitation around long-term commitments. We offer flexible terms and can start with a shorter initial period."
  implementation: "Implementation concerns are valid. We provide dedicated support and typically have clients up and running within [timeframe]."
  resource_intensive: "Actually, our solution is designed to be lightweight and save resources. Most clients spend less than [time] per week managing it."

# Follow-up triggers for automated sequences
follow_up_triggers:
  time_based:
    - days: 3
      template: "followup_3d"
      trigger: "3_days_no_reply"
      delay_days: 3
      action: "send_follow_up"
    - days: 7
      template: "followup_7d"
      trigger: "7_days_no_reply"
      delay_days: 7
      action: "send_follow_up"
    - days: 14
      template: "followup_14d"
      trigger: "14_days_no_reply"
      delay_days: 14
      action: "send_breakup"
  trigger_based:
    - event: "email_open"
      template: "followup_open"
      trigger: "email_opened"
      delay_days: 1
      action: "send_follow_up"
    - event: "link_click"
      template: "followup_click"
      trigger: "link_clicked"
      delay_days: 0
      action: "send_immediate_follow_up"
    - event: "website_visit"
      template: "followup_visit"
      trigger: "website_visited"
      delay_days: 0
      action: "send_personalized_follow_up"

# Breakup sequence for non-responders
breakup_sequence:
  enabled: true
  template: "breakup_final"
  delay_days: 21
  steps:
    - step: 1
      delay_days: 0
      template: "breakup_1_final_attempt"
      branch_on_reply:
        interested: "meeting"
        not_interested: "stop"
        question: "reply"
    - step: 2
      delay_days: 3
      template: "breakup_2_last_chance"
      branch_on_reply:
        interested: "meeting"
        not_interested: "stop"
        question: "reply"
    - step: 3
      delay_days: 5
      template: "breakup_3_goodbye"
      branch_on_reply:
        interested: "meeting"
        not_interested: "stop"
        question: "reply"

# Re-engagement campaigns for old leads
re_engagement_campaign:
  enabled: true
  template: "reengagement_q1"
  interval_days: 90
  trigger_delay_days: 90  # Re-engage after 90 days of no activity
  steps:
    - step: 1
      delay_days: 0
      template: "re_engagement_1_we_miss_you"
      branch_on_reply:
        interested: "meeting"
        not_interested: "stop"
        question: "reply"
    - step: 2
      delay_days: 7
      template: "re_engagement_2_new_offer"
      branch_on_reply:
        interested: "meeting"
        not_interested: "stop"
        question: "reply"
    - step: 3
      delay_days: 14
      template: "re_engagement_3_final_invite"
      branch_on_reply:
        interested: "meeting"
        not_interested: "stop"
        question: "reply"

# Meeting link template for personalization
reply_confidence_threshold: 0.8
meeting_link_template: "Book a 15-min discovery call: {{ booking_url }}"
