dynamic_adjustments:
  volume_bundles:
    enabled: true
    tiers:
      - min_quantity: 3
        discount_percent: 10
      - min_quantity: 6
        discount_percent: 15
      - min_quantity: 10
        discount_percent: 20
  long_term_contracts:
    enabled: true
    terms:
      - duration_months: 6
        discount_percent: 10
      - duration_months: 12
        discount_percent: 20
      - duration_months: 24
        discount_percent: 30
  referral_partner_discounts:
    enabled: true
    discount_percent: 15  # For referred clients
  seasonal_promos:
    enabled: true
    # These would be activated via date ranges in a real implementation
    # For now, they're configurable toggles
    winter_promo:
      enabled: false
      discount_percent: 15
    summer_promo:
      enabled: false
      discount_percent: 10
    holiday_promo:
      enabled: false
      discount_percent: 20

negotiation_limits:
  can_discount: true
  max_discount_pct: 25
  can_bundle: true
  bundle_discount_pct: 15
  can_extend_timeline: true
  max_timeline_extension_weeks: 4
  can_add_maintenance: true
  maintenance_discount_pct: 20
  requires_approval_above: 100000  # INR

base_rates:  # Fallback base rates if service_type not found in service_packages
  website: 1000
  automations: 800
  chatbots: 900
  custom_ai: 1800