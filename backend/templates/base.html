<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI Agency OS{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  {% if owner_email %}
  <nav class="nav" aria-label="Main navigation">
    <div class="nav__inner">
      <span class="nav__brand">{{ agency_name }}</span>
      <div class="nav__links">
        <a href="/discovery" class="nav-link{% if active_page == 'discovery' %} nav-link--active{% endif %}">Discovery</a>
        <a href="/approvals" class="nav-link{% if active_page == 'approvals' %} nav-link--active{% endif %}">
          Approval Queue{% if pending_count and pending_count > 0 %}<span class="nav-badge">{{ pending_count }}</span>{% endif %}
        </a>
        <a href="/audit" class="nav-link{% if active_page == 'audit' %} nav-link--active{% endif %}">Audit Log</a>
      </div>
      <div class="nav__account">
        <span class="nav__email">{{ owner_email }}</span>
        <form method="post" action="/auth/logout">
          <button type="submit" class="btn btn-ghost">Log out</button>
        </form>
      </div>
    </div>
  </nav>
  {% endif %}
  <main id="main" class="main">
    {% if flash %}
    <div class="flash flash--{{ flash.kind }}" role="status">{{ flash.message }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
