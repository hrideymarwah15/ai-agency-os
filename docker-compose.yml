# Local PostgreSQL 15 for development (D-05). Alternative: `brew services start postgresql@15`.
services:
  postgres:
    image: postgres:15
    container_name: ai-agency-os-postgres
    environment:
      POSTGRES_DB: ai_agency_os
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_agency_os"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
