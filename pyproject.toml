[project]
name = "ai-agency-os"
version = "1.0.0"
description = "Autonomous AI-Powered Digital Agency"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "supabase>=2.3.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "httpx>=0.26.0",
    "playwright>=1.40.0",
    "langgraph>=0.0.30",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.0.8",
    "openai>=1.12.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "razorpay>=1.4.0",
    "stripe>=7.0.0",
    "sendgrid>=6.10.0",
    "apscheduler>=3.10.0",
    "loguru>=0.7.0",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

