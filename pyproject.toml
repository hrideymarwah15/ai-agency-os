[project]
name = "ai-agency-os"
version = "1.0.0"
description = "Autonomous AI-Powered Digital Agency"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.52,<0.53",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "sqlalchemy[asyncio]>=2.0.51,<2.1",
    "asyncpg>=0.31,<0.32",
    "alembic>=1.18,<1.19",
    "supabase>=2.31,<2.32",
    "redis>=8.1,<9",
    "httpx>=0.28,<0.29",
    "tenacity>=9.1",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "itsdangerous>=2.2,<3",
    "pwdlib[argon2]>=0.3",
    "pyjwt>=2.13,<3",
    "apscheduler>=3.11,<4",
    "loguru>=0.7",
    "jinja2>=3.1",
    "python-multipart>=0.0.32",
    "playwright==1.61.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: Depends()/Query() in FastAPI argument defaults is the framework's
# dependency-injection contract, not a mutable-default bug.
extend-ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
